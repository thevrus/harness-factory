# .harness/gates.conf: gates run by .harness/bin/gates.sh, one per line.
# Format: name|required|command   (second field: required or optional)
# Commands run with bash -c from the repo root. A required gate makes the run
# MISCONFIGURED (exit 2) when its command is empty, names a missing tool, or is
# a stub that cannot fail. Stubs, after trimming: anything containing
# HARNESS_STUB; exactly `true`, `:` or `exit 0`; anything starting with `: `;
# anything ending in `|| true`, `|| :` or `|| exit 0` (or the same after `;`);
# a command made only of echo/printf calls. An optional gate in those states
# is skipped.
# Seeded by harness-factory from .harness/config.json; edit freely.
test|required|{{commands.test}}
{{?commands.lint}}lint|required|{{commands.lint}}
{{?commands.typecheck}}typecheck|required|{{commands.typecheck}}
{{?commands.build}}build|required|{{commands.build}}
